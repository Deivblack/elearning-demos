<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Prime Choice — Onboarding Outbound</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root {
    --navy: #0D1F3C;
    --navy2: #152D54;
    --teal: #0D9488;
    --teal2: #14B8A6;
    --teal3: #CCFBF1;
    --gold: #F59E0B;
    --rose: #F43F5E;
    --white: #FFFFFF;
    --gray300: #CBD5E1;
    --gray500: #64748B;
    --radius: 16px;
    --hud-h: 56px;
    --touch: 44px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #stars-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 20% 50%, #152D54 0%, #0D1F3C 60%, #060f1e 100%);
  }
  #stars-bg::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 80%, rgba(255,255,255,.35) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 90%, rgba(13,148,136,.55) 0%, transparent 100%);
  }

  .screen { display: none; position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; }
  .screen.active { display: flex; flex-direction: column; animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: none; align-items: center; gap: 10px; flex-wrap: wrap;
    min-height: var(--hud-h);
    background: rgba(13,31,60,.94); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(13,148,136,.3);
    padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  }
  #hud.visible { display: flex; }
  .hud-brand {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px;
    color: var(--teal2); white-space: nowrap; max-width: 42vw; overflow: hidden; text-overflow: ellipsis;
  }
  .hud-spacer { flex: 1; min-width: 8px; }
  .hud-stat { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
  .hud-xp { color: var(--gold); }
  .hud-level { color: var(--teal2); }
  .hud-bar-bg { width: 72px; height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
  .hud-bar-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--teal2)); transition: width .6s ease; }

  .page-wrap {
    width: 100%; max-width: 860px; margin: 0 auto;
    padding: calc(var(--hud-h) + 28px) 16px 48px;
    display: flex; flex-direction: column; align-items: center;
  }
  #screen-welcome .page-wrap,
  #screen-welcome { padding-top: 0; }

  .lang-switch {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 16px; width: 100%;
  }
  .lang-label { font-size: 12px; color: var(--gray500); font-weight: 600; }
  .lang-group { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .lang-btn {
    min-height: 40px; min-width: 72px; padding: 8px 14px;
    border-radius: 10px; border: 1.5px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.06); color: var(--gray300);
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .lang-btn.active, .lang-btn[aria-pressed="true"] {
    border-color: var(--teal); background: rgba(13,148,136,.2); color: var(--teal2);
  }
  .lang-btn:hover { border-color: var(--teal2); }

  .avatar-guide {
    display: flex; align-items: flex-start; gap: 12px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 12px; margin-bottom: 18px; width: 100%;
  }
  .avatar-guide img {
    width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--teal); flex-shrink: 0; background: var(--navy2);
  }
  .ag-name { font-size: 12px; font-weight: 700; color: var(--teal2); margin-bottom: 4px; }
  .ag-bubble { font-size: 14px; color: var(--gray300); line-height: 1.5; }

  #screen-welcome {
    justify-content: center; align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px 40px;
    text-align: center;
  }
  .welcome-inner { max-width: 640px; width: 100%; }
  .badge-demo {
    display: inline-block;
    background: rgba(13,148,136,.2); border: 1px solid var(--teal);
    color: var(--teal2); font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; padding: 6px 12px; border-radius: 20px; margin-bottom: 18px;
  }
  .welcome-avatar {
    width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--teal); margin: 0 auto 16px; display: block;
    box-shadow: 0 8px 28px rgba(13,148,136,.35);
  }
  .welcome-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(28px, 7vw, 48px); font-weight: 700; line-height: 1.08; margin-bottom: 12px;
  }
  .welcome-title .hi { color: var(--gray300); font-size: .42em; font-weight: 400; display: block; margin-bottom: 6px; }
  .welcome-title .brand { color: var(--teal2); }
  .welcome-sub { color: var(--gray300); font-size: 15px; line-height: 1.65; margin-bottom: 22px; }
  .name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .input-field {
    background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.15);
    color: var(--white); font-family: inherit; font-size: 16px;
    padding: 12px 14px; border-radius: 10px; outline: none; width: 100%;
    min-height: var(--touch);
  }
  .input-field:focus { border-color: var(--teal); }
  .input-field::placeholder { color: var(--gray500); }

  .btn-primary, .btn-secondary {
    min-height: var(--touch); font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 12px 22px; border-radius: 10px; cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--teal), var(--teal2));
    color: var(--white); border: none;
    box-shadow: 0 4px 16px rgba(13,148,136,.35);
  }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .45; cursor: default; transform: none; }
  .btn-secondary {
    background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.15); color: var(--white);
  }
  .welcome-path { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
  .path-chip {
    font-size: 11px; font-weight: 600; color: var(--gray300);
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    padding: 6px 10px; border-radius: 999px;
  }

  .missions-header { width: 100%; margin-bottom: 16px; }
  .missions-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 5vw, 28px); font-weight: 700; margin-bottom: 6px; }
  .missions-sub { color: var(--gray500); font-size: 14px; line-height: 1.45; }
  .hello-line { color: var(--teal2); font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .missions-grid { display: grid; grid-template-columns: 1fr; gap: 10px; width: 100%; }

  .mission-card {
    background: rgba(255,255,255,.04); border: 1.5px solid rgba(255,255,255,.1);
    border-radius: var(--radius); padding: 16px;
    display: flex; align-items: center; gap: 14px; width: 100%;
    cursor: pointer; transition: all .2s; text-align: left; color: inherit; font: inherit;
    min-height: 72px;
  }
  .mission-card:hover:not(:disabled) { border-color: var(--teal); background: rgba(13,148,136,.08); }
  .mission-card.locked, .mission-card:disabled { opacity: .45; cursor: not-allowed; }
  .mission-card.completed { border-color: rgba(13,148,136,.4); background: rgba(13,148,136,.06); }
  .mc-icon-wrap {
    width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .mc-body { flex: 1; min-width: 0; }
  .mc-num { font-size: 11px; font-weight: 700; color: var(--teal2); letter-spacing: 1px; margin-bottom: 2px; }
  .mc-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .mc-desc { font-size: 13px; color: var(--gray500); line-height: 1.4; }
  .mc-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mc-tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
  .mc-xp { background: rgba(245,158,11,.15); color: var(--gold); }
  .mc-time { background: rgba(255,255,255,.08); color: var(--gray300); }
  .mc-done { background: rgba(34,197,94,.15); color: #86EFAC; }
  .mc-status { font-size: 18px; flex-shrink: 0; }

  .lesson-wrap { width: 100%; }
  .lesson-breadcrumb { font-size: 12px; color: var(--gray500); margin-bottom: 6px; }
  .lesson-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(20px, 4.5vw, 24px); font-weight: 700; margin-bottom: 6px; }
  .lesson-xp-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(245,158,11,.15); color: var(--gold);
    font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; margin-bottom: 14px;
  }
  .lp-steps { display: flex; gap: 6px; margin-bottom: 18px; }
  .lp-step { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); }
  .lp-step.done { background: var(--teal); }
  .lp-step.active { background: var(--teal2); animation: pulse-bar 1.2s infinite; }
  @keyframes pulse-bar { 0%,100%{opacity:1} 50%{opacity:.5} }

  .info-card {
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 18px; margin-bottom: 14px; line-height: 1.65;
    font-size: 15px; color: #CBD5E1;
  }
  .info-card h3 {
    font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700;
    color: var(--white); margin-bottom: 10px;
  }
  .info-card p { margin-bottom: 10px; }
  .info-highlight {
    background: rgba(13,148,136,.12); border-left: 3px solid var(--teal);
    border-radius: 0 8px 8px 0; padding: 12px 14px; margin: 12px 0; color: var(--teal3); font-weight: 500;
  }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .info-item {
    background: rgba(255,255,255,.06); border-radius: 10px; padding: 12px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .info-item .ii-icon { font-size: 18px; flex-shrink: 0; }
  .info-item strong { display: block; font-size: 13px; color: var(--white); margin-bottom: 3px; }
  .info-item span { font-size: 12px; color: var(--gray500); line-height: 1.4; }

  .color-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 12px 0; }
  .color-chip {
    border-radius: 12px; padding: 12px 10px; text-align: center; font-size: 13px; font-weight: 700;
    border: 1px solid rgba(255,255,255,.12);
  }
  .color-chip small { display: block; font-weight: 500; opacity: .85; margin-top: 4px; font-size: 11px; }

  .flow-steps { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .flow-step {
    display: flex; gap: 12px; align-items: flex-start;
    background: rgba(255,255,255,.05); border-radius: 10px; padding: 12px;
  }
  .flow-num {
    width: 28px; height: 28px; border-radius: 50%; background: rgba(13,148,136,.25);
    color: var(--teal2); font-weight: 800; font-size: 13px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .quiz-card {
    background: rgba(255,255,255,.05); border: 1.5px solid rgba(245,158,11,.25);
    border-radius: 14px; padding: 18px; margin-bottom: 14px;
  }
  .quiz-label {
    font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .quiz-question { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; margin-bottom: 14px; line-height: 1.4; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-option {
    background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 12px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    display: flex; align-items: flex-start; gap: 12px; transition: all .15s;
    text-align: left; color: inherit; font-family: inherit; width: 100%; min-height: var(--touch);
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--teal); background: rgba(13,148,136,.1); }
  .quiz-option.correct { border-color: #22C55E; background: rgba(34,197,94,.12); color: #86EFAC; }
  .quiz-option.wrong { border-color: var(--rose); background: rgba(244,63,94,.12); color: #FDA4AF; }
  .quiz-option.disabled, .quiz-option:disabled { cursor: default; }
  .opt-letter {
    width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .opt-text { flex: 1; line-height: 1.4; padding-top: 4px; }
  .quiz-feedback {
    margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 14px; display: none; line-height: 1.5;
  }
  .quiz-feedback.show { display: block; }
  .quiz-feedback.success { background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3); color: #86EFAC; }
  .quiz-feedback.error { background: rgba(244,63,94,.12); border: 1px solid rgba(244,63,94,.3); color: #FDA4AF; }

  .lesson-nav {
    display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; width: 100%; margin-top: 8px;
  }
  .lesson-nav .btn-primary, .lesson-nav .btn-secondary { flex: 1 1 140px; }

  .xp-popup {
    position: fixed; top: calc(var(--hud-h) + 12px); right: 16px; z-index: 200;
    background: var(--gold); color: var(--navy);
    font-size: 15px; font-weight: 800; padding: 10px 16px; border-radius: 10px;
    pointer-events: none; animation: xpAnim .9s ease forwards;
  }
  @keyframes xpAnim {
    0% { opacity: 0; transform: translateY(8px) scale(.8); }
    20% { opacity: 1; transform: translateY(0) scale(1); }
    70% { opacity: 1; transform: translateY(-4px); }
    100% { opacity: 0; transform: translateY(-20px); }
  }

  .badge-popup {
    position: fixed; inset: 0; z-index: 300; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
    padding: 16px;
  }
  .badge-popup.show { display: flex; }
  .badge-inner {
    background: var(--navy2); border: 2px solid var(--gold);
    border-radius: 20px; padding: 28px 22px; text-align: center;
    max-width: 360px; width: 100%;
  }
  .badge-icon { font-size: 52px; margin-bottom: 10px; }
  .badge-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: var(--gold); margin-bottom: 8px; }
  .badge-desc { color: var(--gray300); font-size: 14px; line-height: 1.55; margin-bottom: 14px; }
  .badge-xp { font-size: 24px; font-weight: 900; color: var(--gold); }

  .results-wrap { width: 100%; text-align: center; }
  .results-icon { font-size: 56px; margin-bottom: 10px; }
  .results-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 6vw, 32px); font-weight: 800; margin-bottom: 8px; }
  .results-sub { color: var(--gray300); font-size: 15px; margin-bottom: 22px; }
  .results-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
  .rs-card {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 16px 10px;
  }
  .rs-value { font-size: clamp(22px, 5vw, 30px); font-weight: 900; margin-bottom: 4px; }
  .rs-label { font-size: 12px; color: var(--gray500); }
  .module-scores { width: 100%; margin-bottom: 20px; text-align: left; }
  .module-scores h3 { font-size: 13px; color: var(--gray300); margin-bottom: 10px; letter-spacing: 1px; }
  .ms-row {
    display: flex; justify-content: space-between; gap: 12px;
    background: rgba(255,255,255,.05); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    font-size: 14px;
  }
  .ms-row span:last-child { color: var(--gold); font-weight: 700; white-space: nowrap; }
  .cert-banner {
    background: linear-gradient(135deg, rgba(13,148,136,.2), rgba(20,184,166,.1));
    border: 1.5px solid var(--teal); border-radius: 14px; padding: 18px; margin-bottom: 18px; text-align: left;
  }
  .cert-banner h3 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; color: var(--teal2); margin-bottom: 6px; }
  .cert-banner p { font-size: 14px; color: var(--gray300); line-height: 1.5; }
  .results-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  .hud-lang { margin-left: auto; }
  #hud .lang-switch { margin: 0; justify-content: flex-end; }
  #hud .lang-label { display: none; }
  #hud .lang-btn { min-height: 36px; min-width: 0; padding: 6px 10px; font-size: 12px; }

  @media (max-width: 720px) {
    .info-grid { grid-template-columns: 1fr; }
    .name-grid { grid-template-columns: 1fr; }
    .results-stats { grid-template-columns: 1fr; }
    .hud-level { display: none; }
    .hud-bar-bg { width: 48px; }
    .welcome-avatar { width: 84px; height: 84px; }
    .avatar-guide img { width: 48px; height: 48px; }
    .page-wrap { padding-left: 14px; padding-right: 14px; }
    .mission-card { align-items: flex-start; }
  }

  @media (min-width: 721px) and (max-width: 1024px) {
    .page-wrap { max-width: 720px; padding-left: 24px; padding-right: 24px; }
    .info-grid { grid-template-columns: 1fr 1fr; }
  }

  @media (min-width: 1025px) {
    .page-wrap { padding-left: 28px; padding-right: 28px; }
  }
</style>
</head>
<body>
<div id="stars-bg"></div>

<div id="hud">
  <div class="hud-brand" id="hud-brand">Prime Choice · Outbound</div>
  <div class="hud-spacer"></div>
  <div class="hud-stat hud-level"><span id="hud-level-txt">—</span></div>
  <div class="hud-stat hud-xp">⚡ <span id="hud-xp-txt">0 XP</span></div>
  <div class="hud-bar-bg"><div class="hud-bar-fill" id="hud-bar" style="width:0%"></div></div>
  <span style="font-size:12px;color:var(--gray500)" id="hud-prog-txt">0/5</span>
  <div class="lang-switch" data-lang-switch></div>
</div>

<div id="screen-welcome" class="screen active">
  <div class="welcome-inner">
    <div class="lang-switch" data-lang-switch></div>
    <div class="badge-demo" id="badge-demo">Piloto · ~20 min</div>
    <img class="welcome-avatar" data-avatar-src="assets/avatar/guide.jpg" src="assets/avatar/guide.jpg" alt=""/>
    <h1 class="welcome-title">
      <span class="hi" id="welcome-hi">Bienvenido/a a</span>
      <span class="brand" id="welcome-brand">Prime Choice</span><br>
      <span id="welcome-subbrand">Outbound</span>
    </h1>
    <p class="welcome-sub" id="welcome-sub"></p>
    <div class="name-grid">
      <input class="input-field" id="first-name" type="text" maxlength="40" autocomplete="given-name"/>
      <input class="input-field" id="last-name" type="text" maxlength="40" autocomplete="family-name"/>
    </div>
    <button class="btn-primary" id="btn-start" type="button">¡Empezar misiones!</button>
    <div class="welcome-path">
      <span class="path-chip" id="chip-safety">1</span>
      <span class="path-chip" id="chip-process">2</span>
      <span class="path-chip" id="chip-belt">3</span>
      <span class="path-chip" id="chip-container">4</span>
      <span class="path-chip" id="chip-more">5</span>
    </div>
  </div>
</div>

<div id="screen-missions" class="screen">
  <div class="page-wrap">
    <div class="lang-switch" data-lang-switch></div>
    <div class="avatar-guide">
      <img data-avatar-src="assets/avatar/guide.jpg" src="assets/avatar/guide.jpg" alt=""/>
      <div>
        <div class="ag-name">Tu guía</div>
        <div class="ag-bubble" id="guide-missions-text"></div>
      </div>
    </div>
    <div class="missions-header">
      <p class="hello-line" id="hello-line"></p>
      <h2 class="missions-title" id="missions-title"></h2>
      <p class="missions-sub" id="missions-sub"></p>
    </div>
    <div class="missions-grid" id="missions-grid"></div>
  </div>
</div>

<div id="screen-lesson" class="screen">
  <div class="page-wrap">
    <div class="lesson-wrap">
      <div class="avatar-guide" id="lesson-guide">
        <img data-avatar-src="assets/avatar/guide.jpg" src="assets/avatar/guide.jpg" alt=""/>
        <div>
          <div class="ag-name">Tu guía</div>
          <div class="ag-bubble" id="guide-lesson-text"></div>
        </div>
      </div>
      <div class="lesson-breadcrumb" id="lesson-breadcrumb"></div>
      <h2 class="lesson-title" id="lesson-title"></h2>
      <div class="lesson-xp-badge">⚡ <span id="lesson-xp-badge"></span></div>
      <div class="lp-steps" id="lp-steps"></div>
      <div id="lesson-content"></div>
      <div class="lesson-nav" id="lesson-nav"></div>
    </div>
  </div>
</div>

<div id="screen-results" class="screen">
  <div class="page-wrap">
    <div class="results-wrap">
      <div class="lang-switch" data-lang-switch></div>
      <div class="avatar-guide" style="text-align:left">
        <img data-avatar-src="assets/avatar/guide.jpg" src="assets/avatar/guide.jpg" alt=""/>
        <div>
          <div class="ag-name">Tu guía</div>
          <div class="ag-bubble" id="results-guide-text"></div>
        </div>
      </div>
      <div class="results-icon" id="results-icon">🏁</div>
      <h2 class="results-title" id="results-title"></h2>
      <p class="results-sub" id="results-sub"></p>
      <div class="results-stats">
        <div class="rs-card"><div class="rs-value" style="color:var(--gold)" id="r-xp">0</div><div class="rs-label" id="label-xp-total"></div></div>
        <div class="rs-card"><div class="rs-value" style="color:var(--teal2)" id="r-correct">0/0</div><div class="rs-label" id="label-trivia"></div></div>
        <div class="rs-card"><div class="rs-value" style="color:#A78BFA" id="r-modules">0/5</div><div class="rs-label" id="label-modules"></div></div>
      </div>
      <div class="module-scores">
        <h3 id="scoreboard-title"></h3>
        <div id="module-scoreboard"></div>
      </div>
      <div class="cert-banner">
        <h3 id="cert-title"></h3>
        <p id="cert-line"></p>
      </div>
      <div class="results-actions">
        <button class="btn-secondary" id="btn-restart" type="button"></button>
      </div>
    </div>
  </div>
</div>

<div id="badge-modal" class="badge-popup">
  <div class="badge-inner">
    <div class="badge-icon" id="bm-icon"></div>
    <div class="badge-title" id="bm-title"></div>
    <div class="badge-desc" id="bm-desc"></div>
    <div class="badge-xp" id="bm-xp"></div>
    <div style="font-size:12px;color:var(--gray500);margin:6px 0 16px" id="bm-xp-label"></div>
    <button class="btn-primary" id="bm-continue" type="button"></button>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
